{__NOLAYOUT__}
<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{$site.site_name|default='账号分享'} - 访问验证</title>
    <link rel="stylesheet" href="/static/css/panel.css?v=20260901-ui4">
    <link rel="stylesheet" href="/static/css/shadcn-controls.css?v=20260902-controls1">
    <link rel="stylesheet" href="/static/css/share-enhancements.css?v=20260903-share2">
</head>
<body class="share-page">
<main class="share-container share-gate" aria-labelledby="share-password-title">
    <header class="share-hero">{if $site.site_logo}<img class="share-hero-logo" src="{$site.site_logo}" alt="">{/if}<p class="share-hero-kicker">{$site.site_name|default='账号分享'}</p><h1 id="share-password-title">受保护的分享页</h1><p>输入访问密码后即可查看已授权的账号信息。</p></header>
    <section class="share-auth-panel">
        <div class="share-lock-icon" aria-hidden="true">⌁</div>
        <h2>请输入访问密码</h2>
        <p>密码由分享人提供，验证成功后才会开始记录访问和有效时间。</p>
        <form method="post" action="">
            <label class="share-auth-label" for="password">访问密码</label>
            <div class="share-password-wrap">
                <input class="share-auth-input" type="password" id="password" name="password" autocomplete="current-password" required autofocus>
                <button class="share-password-toggle" type="button" data-password-toggle="password" aria-label="显示密码" aria-pressed="false">显示</button>
            </div>
            <button class="share-auth-submit" type="submit">继续查看</button>
        </form>
    </section>
    <footer class="share-footer">{$site.site_name|default='账号分享'} · 请仅在授权范围内使用</footer>
</main>
<script src="/static/js/panel.js?v=20260901-ui3"></script>
</body>
</html>
