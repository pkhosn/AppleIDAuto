name: Security checks

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer audit --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci && npm audit --audit-level=low
      - run: npm ci --prefix frontend && npm audit --prefix frontend --audit-level=low
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pip-audit
      - run: pip-audit -r automation-server/requirements.txt
      - run: pip-audit -r account-driver/requirements.txt

  regression-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: review-fixture-only
          MYSQL_DATABASE: apple_review_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -preview-fixture-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_NAME: apple_review_test
      TEST_DB_USER: root
      TEST_DB_PASSWORD: review-fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, pdo_mysql, mbstring, curl, openssl
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash -n upgrade.sh && php -l scripts/upgrade_helper.php
      - run: python -m unittest discover -s tests -v
      - run: php tests/test_review_business.php
      - run: python -m pip install -r automation-server/requirements.txt
      - run: PYTHONPATH=automation-server python -m unittest discover -s automation-server/tests -v
      - run: python -m pip install -r account-driver/requirements.txt
      - run: PYTHONPATH=account-driver python -m unittest discover -s account-driver/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend -- --run
