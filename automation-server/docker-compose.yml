services:
  automation-server:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:3939:3939"
    # 容器日志轮转：避免 json-file 日志无限增长（下次重建容器时生效）。
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://localhost:3939/health',headers={'token':os.environ['AUTOMATION_TOKEN']}); urllib.request.urlopen(r,timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - automation-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      account-driver:
        condition: service_healthy
    restart: unless-stopped
  account-driver:
    build: ../account-driver
    env_file: .env
    environment:
      SELENIUM_URL: http://selenium:4444/wd/hub
      APPLE_UI_LOCALE: ${APPLE_UI_LOCALE:-zh-CN}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - driver-artifacts:/data/artifacts
    expose:
      - "3940"
    depends_on:
      selenium:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3940/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  selenium:
    image: selenium/standalone-chromium:4.47.0-20260808
    shm_size: 2gb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:7900:7900"
      - "127.0.0.1:5900:5900"
    environment:
      SE_NODE_MAX_SESSIONS: "1"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "false"
      SE_NODE_SESSION_TIMEOUT: "900"
      SE_ENABLE_BROWSER_LEFTOVERS_CLEANUP: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:4444/status', timeout=3)); v=d.get('value',{}); nodes=v.get('nodes',[]) if isinstance(v,dict) else []; sys.exit(0 if any(isinstance(n,dict) and n.get('availability') == 'UP' for n in nodes) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
volumes:
  automation-data:
  redis-data:
  driver-artifacts:
