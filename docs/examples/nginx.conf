# 示例：在已有 Nginx http {} 内加载。替换域名、目录、证书和 PHP socket。
server {
    listen 80;
    server_name apple.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/appleid/public;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name apple.example.com;
    root /opt/appleid/public;
    index index.html;

    ssl_certificate /etc/ssl/appleid/fullchain.pem;
    ssl_certificate_key /etc/ssl/appleid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # 只允许执行公开目录中的单一 PHP 入口。
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    # ThinkPHP 业务入口先于 SPA 回退，保留原请求 URI 和查询参数。
    location ~ ^/(frontend-api|api|share|shareapi|pay|install)(/|$) {
        try_files $uri /index.php$is_args$args;
    }

    location /control-app/assets/ {
        try_files $uri =404;
    }

    location /react-preview/ {
        try_files $uri $uri/ /react-preview/index.html;
    }

    location = / {
        try_files /control-app/index.html =404;
    }

    # 用户路径及任意合法的动态管理员前缀均使用同一 SPA。
    location / {
        try_files $uri $uri/ /control-app/index.html;
    }
}
